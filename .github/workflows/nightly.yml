name: nightly drift

on:
  schedule:
    # 06:10 UTC — the directory regenerates around 05:40, so this reads a fresh crawl.
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Snapshot and diff
        run: npm run nightly

      - name: Commit tonight's baseline
        run: |
          git config user.name  "webmcp-drift"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots reports docs history.json
          if git diff --staged --quiet; then
            echo "nothing moved"
          else
            git commit -m "drift: $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
